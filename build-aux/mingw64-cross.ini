[constants]
mingw_sysroot = '/usr/x86_64-w64-mingw32/sys-root/mingw'
build_aux = '@GLOBAL_SOURCE_ROOT@' / 'build-aux'

[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = build_aux / 'mingw-pkg-config'
exe_wrapper = 'wine'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
# Give the cross pkg-config the target sysroot plus the gobject-introspection
# shim used to locate the build-machine scanner and compiler.
pkg_config_libdir = [build_aux / 'mingw-gi', mingw_sysroot / 'lib/pkgconfig', mingw_sysroot / 'share/pkgconfig']
mingw_sysroot = mingw_sysroot
mingw_dlltool = 'x86_64-w64-mingw32-dlltool'
